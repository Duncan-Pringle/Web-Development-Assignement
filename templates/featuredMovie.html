<section class="featured-section">
            <h2>{{ featured_movie.title }}</h2>
            <div class="featured-content">
                <div class="image-placeholder featured-img"></div>
                <div class="featured-details">
                    <p class="synopsis">{{ featured_movie.description }}</p>
                    <div class="button-group">
                        <button class="btn">Watch Trailer</button>
                        <button class="btn" onclick="movieDetails()">Details</button>
                    </div>
                </div>
            </div>
</section>
