{% extends "base.html" %}

{% block title %}{{ movie.title }}{% endblock %}

{% block content %}
{% include 'header.html' %}
    <div class="view-movie-details">
        
        <div class="view-poster-column">
            <img src="{{ movie.poster_url }}" alt="{{ movie.title }}">
        </div>

        <div class="view-info-column">
            <h1>{{ movie.title }}</h1>
            
            <div class="view-metadata">
                <span> {{ movie.year }}</span>
                <span> {{ movie.rating }}</span>
            </div>

            <p><strong>Genres:</strong> {{ movie.genres | join(', ') }}</p>

            <h3 class="view-description-heading">Overview</h3>
            <p class="view-description-text">{{ movie.description }}</p>
            
            <div style="margin-top: 30px;">
                <a href="/" class="btn">Back to Hub</a>
            </div>
        </div>

    </div>
{% endblock %}
