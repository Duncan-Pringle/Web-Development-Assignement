<section class="featured-section">
    <div class="featured-container">
        <div class="featured-img-wrapper">
            <img src="{{ featured_movie.poster_url }}" alt="{{ featured_movie.title }}">
        </div>

        <div class="featured-text">
            <h2 class="featured-title">{{ featured_movie.title }}</h2>
            <div class="featured-meta">
                <span>Featured Today</span>
            </div>
            <p class="synopsis">{{ featured_movie.description }}</p>

            <div class="button-group">
                <a href="/movie/{{ featured_movie.title }}" class="btn btn-primary">
                    View Details
                </a>
                <a href="https://www.youtube.com/results?search_query={{ featured_movie.title }} trailer"
                   target="_blank"
                   class="btn btn-outline">
                    Watch Trailer
                </a>
            </div>
        </div>
    </div>
</section>
